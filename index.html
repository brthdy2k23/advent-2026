<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">
  <meta name="description" content="Ein persönlicher Adventskalender mit 24 Türchen.">
  <title>Ein Advent für dich</title>
  <link rel="icon" href="./assets/advent-icon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./scripts/app.js"></script>
</head>
<body>
  <header class="masthead shell">
    <a class="masthead__title" href="./">
      <span class="spark masthead__mark" aria-hidden="true"></span>
      Adventskalender
    </a>
    <span class="masthead__year">Dezember 2026</span>
  </header>

  <main class="shell">
    <section class="cover" aria-labelledby="cover-title">
      <div class="cover__copy">
        <h1 id="cover-title">Ein Advent<br><em>für dich.</em></h1>
        <p>24 kleine Überraschungen bis Weihnachten.</p>
      </div>
      <img class="cover__art" src="./assets/tannenzweig.webp" width="1100" height="733" alt="" fetchpriority="high">
    </section>

    <section class="calendar" aria-labelledby="calendar-title">
      <div class="calendar__heading">
        <h2 id="calendar-title">Die Türchen</h2>
        <p id="calendar-status" role="status"></p>
      </div>
      <noscript><p>Aktiviere JavaScript, um die Türchen zu öffnen.</p></noscript>
      <ol class="door-grid" id="door-grid" role="list"></ol>
    </section>
  </main>

  <template id="door-template">
    <li>
      <button class="door" type="button">
        <span class="door__number"></span>
        <span class="door__ornament" aria-hidden="true"><span></span></span>
        <span class="door__state">
          <span class="door__stamp" aria-hidden="true"></span>
          <span class="door__today" hidden>Heute</span>
        </span>
      </button>
      <span class="door__description" hidden></span>
    </li>
  </template>

  <dialog class="door-dialog" id="door-dialog" aria-labelledby="scratch-title">
    <div class="dialog-sheet">
      <section class="scratch" id="scratch-stage" hidden>
        <h2 id="scratch-title"></h2>
        <p>Streich mit dem Finger oder der Maus über die goldene Fläche.</p>
        <button class="scratch__surface" id="scratch-surface" type="button"
          aria-label="Rubbelfläche" aria-describedby="scratch-keys">
          <span class="spark scratch__spark" aria-hidden="true"></span>
          <canvas id="scratch-canvas" width="720" height="400" aria-hidden="true"></canvas>
        </button>
        <span id="scratch-keys" hidden>Mit der Leer- oder Eingabetaste abschnittsweise freirubbeln.</span>
      </section>

      <section class="letter" id="letter-stage" hidden>
        <div class="letter__copy">
          <p class="letter__date" id="letter-date"></p>
          <h2 id="letter-title" tabindex="-1"></h2>
          <div class="letter__body" id="letter-body"></div>
        </div>
        <div class="letter__media" id="letter-media">
          <div class="letter__placeholder" aria-hidden="true">
            <span class="spark letter__spark"></span>
          </div>
        </div>
      </section>

      <button class="close-button" id="dialog-close" type="button" aria-label="Schließen"></button>
    </div>
  </dialog>
</body>
</html>
